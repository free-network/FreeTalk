<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Main gradient matching Freenet brand -->
    <linearGradient id="ftGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5fe1ff"/>
      <stop offset="50%" stop-color="#2962f6"/>
      <stop offset="100%" stop-color="#182c8d"/>
    </linearGradient>
    <linearGradient id="ftGradient2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#92e0fc"/>
      <stop offset="60%" stop-color="#49a0f8"/>
      <stop offset="100%" stop-color="#2962f6"/>
    </linearGradient>
    <linearGradient id="ftGradient3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b4f4ff"/>
      <stop offset="40%" stop-color="#50c4fa"/>
      <stop offset="100%" stop-color="#2962f6"/>
    </linearGradient>
    <!-- Shadow/depth effect -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#182c8d" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background circle (optional, can be removed for transparent) -->

  <!-- Large speech bubble (back) - represents community/group -->
  <path d="M75 25
           C95 25, 105 40, 105 55
           C105 70, 95 85, 75 85
           L55 85
           L50 95
           L48 85
           L45 85
           C25 85, 15 70, 15 55
           C15 40, 25 25, 45 25
           Z"
        fill="url(#ftGradient1)"
        filter="url(#shadow)"
        opacity="0.9"/>

  <!-- Medium speech bubble (middle) - conversation flow -->
  <path d="M72 32
           C88 32, 96 44, 96 56
           C96 68, 88 80, 72 80
           L54 80
           L50 90
           L48 80
           L48 80
           C32 80, 24 68, 24 56
           C24 44, 32 32, 48 32
           Z"
        fill="url(#ftGradient2)"
        opacity="0.95"/>

  <!-- Chat dots representing active conversation -->
  <g fill="white" opacity="0.95">
    <circle cx="45" cy="56" r="5"/>
    <circle cx="60" cy="56" r="5"/>
    <circle cx="75" cy="56" r="5"/>
  </g>

  <!-- Small accent - connection/link symbol -->
  <path d="M82 38 Q90 42, 88 50"
        stroke="url(#ftGradient3)"
        stroke-width="3"
        stroke-linecap="round"
        fill="none"
        opacity="0.7"/>

  <!-- Small wave accent at bottom representing Freenet/River connection -->
  <path d="M30 100 Q40 95, 50 100 Q60 105, 70 100 Q80 95, 90 100"
        stroke="url(#ftGradient1)"
        stroke-width="3"
        stroke-linecap="round"
        fill="none"
        opacity="0.6"/>
</svg>
